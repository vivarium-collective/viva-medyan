[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viva-medyan"
version = "0.1.0"
description = "Process-bigraph wrapper for MEDYAN-style mechanochemical cytoskeletal network simulations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "process-bigraph>=0.0.10",
    "bigraph-schema",
    "bigraph-viz",
    "viva-superpowers",
    "pyyaml",
    "numpy",
    "matplotlib",
    "jsonschema[format-nongpl]>=4.21",
    "jinja2>=3.1",
    "pypdf>=4.0",
    "plotly",
    "vivarium-workbench",
]

[project.optional-dependencies]
cli = ["typer", "rich"]
dev = ["pytest", "plotly"]

[tool.uv.sources]
viva-superpowers = { git = "https://github.com/vivarium-collective/viva-superpowers.git", branch = "main" }

[tool.setuptools.packages.find]
include = ["pbg_medyan*"]

[project.scripts]
viva-medyan = "pbg_medyan.cli.__main__:main"
